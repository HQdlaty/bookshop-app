<section class="page page-admin-books container py-5">
  <div class="d-flex flex-wrap align-items-start justify-content-between gap-2 mb-4">
    <div>
      <h1 class="h2 mb-1"><i class="bi bi-journal-text me-2" aria-hidden="true"></i>Manage books</h1>
      <p class="text-body-secondary mb-0">Add, edit and remove books in the catalog.</p>
    </div>
    <div class="d-flex flex-wrap gap-2">
      <a class="btn btn-outline-secondary" href="/admin"><i class="bi bi-arrow-left me-1" aria-hidden="true"></i>Dashboard</a>
      <a class="btn btn-primary" href="/admin/books/add"><i class="bi bi-plus-lg me-1" aria-hidden="true"></i>Add book</a>
    </div>
  </div>

  <p class="text-body-secondary small mb-2" data-summary role="status"></p>
  <div data-status></div>

  <div class="table-responsive" data-table-wrap hidden>
    <table class="table table-hover align-middle">
      <caption class="visually-hidden">Books</caption>
      <thead>
        <tr>
          <th scope="col">Title</th>
          <th scope="col">Author</th>
          <th scope="col">Category</th>
          <th scope="col" class="text-end">Price</th>
          <th scope="col" class="text-end">Actions</th>
        </tr>
      </thead>
      <tbody data-rows></tbody>
    </table>
  </div>

  <div class="mt-4" data-pagination></div>
</section>
